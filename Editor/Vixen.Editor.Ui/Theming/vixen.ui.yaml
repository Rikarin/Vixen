#
# The editor's design tokens, for the utility generator.
#
# ⚠ **This file declares no colours of its own, and that is the entire point.** Every value below is
# a `var(--…)` reference to a custom property `EditorTheme` already puts on the root, so there is one
# palette and not two: `bg-surface` and the hand-written `panel { background: var(--surface); }` read
# the same declaration, a user's theme file overriding `--surface` through `ThemeService` moves both,
# and `root.dark` moves both again when the theme is toggled. A yaml that copied the hex out of
# `EditorTheme` would be a second palette that agreed with the first until the day somebody edited
# one of them.
#
# ⚠ **The colour names are the token names, verbatim**, which is what makes the mapping checkable by
# eye — and the price is that the family prefix and the token name sometimes both say the same word:
# `text-text-muted` is the muted text colour, and `border-border` is the hairline. Renaming either
# half to read better is how a second vocabulary starts.
#
# **An opacity modifier on one of these works, and used not to.** It used to say here that
# `bg-accent/50` silently dropped its opacity, and it did: `TryColor` produced `rgba(…)` by taking the
# colour apart as a hex triple, and `var(--accent)` is not one — so every token in this file, all of
# which are references, was in that class. It now emits
# `color-mix(in oklab, var(--accent) 50%, transparent)`, which never takes the colour apart, and the
# variable is resolved before the mix is evaluated. `opacity-50` on the element is still the right
# answer when the *whole* element should be translucent; the modifier is for when only the fill is.
#
# ⚠ **`darkMode` is deliberately absent** — the default is `media`, and neither strategy is what the
# editor does. The editor's dark theme is `ThemeService` putting a `dark` class on the *root* and the
# tokens above being redeclared under `root.dark`; a `dark:` variant would be a second mechanism
# selecting the same thing. Write `bg-surface` and let the token move.

theme:
    # ⚠ Two, not Tailwind's four. The editor's chrome is drawn on a two-pixel rhythm — 2, 4, 6, 8 and
    # 10 are all present in `EditorTheme`, and a 6px gutter is the commonest of them — so a base of 2
    # makes every measurement the sheet already uses a whole number of steps. A base of 4 cannot say
    # 6px at all, which would leave `gap-[6px]` as the way to write the editor's most common gap.
    spacing: 2

    colors:
        # The four surfaces the whole depth model is made of. See `EditorTheme`'s remarks: depth here
        # comes from luminance steps rather than from borders, and these are the steps.
        workspace: 'var(--workspace)'
        surface:
            DEFAULT: 'var(--surface)'
            sunken: 'var(--surface-sunken)'
            raised: 'var(--surface-raised)'
            hover: 'var(--surface-hover)'

        # The hairline, which is *darker* than the surface it edges — a seam rather than a bevel.
        border:
            DEFAULT: 'var(--border)'
            active: 'var(--border-active)'

        text:
            DEFAULT: 'var(--text)'
            muted: 'var(--text-muted)'

        accent:
            DEFAULT: 'var(--accent)'
            text: 'var(--accent-text)'
            soft: 'var(--accent-soft)'
            deep: 'var(--accent-deep)'

        danger: 'var(--danger)'
        warning: 'var(--warning)'

        # The parts a control draws itself out of, which are tokens because a slider, a scrollbar and
        # a progress bar are the same three colours arranged differently.
        track: 'var(--track-color)'
        fill: 'var(--fill-color)'
        thumb: 'var(--thumb-color)'
        selection: 'var(--selection-color)'
        caret: 'var(--caret-color)'

        # Chrome is the strip around the working surface — menu bar, toolbar, status bar — and it is
        # its own ramp because it sits *on* the desk rather than being one of the cards laid on it.
        chrome:
            DEFAULT: 'var(--chrome)'
            sunken: 'var(--chrome-sunken)'
            text: 'var(--chrome-text)'

        # ⚠ Three shades each, and the soft/strong pair is not decoration. A green button hovered
        # with the generic neutral grey reads as the colour draining out of it at the one instant it
        # most needs to look live.
        play:
            DEFAULT: 'var(--play)'
            soft: 'var(--play-soft)'
            strong: 'var(--play-strong)'
        pause:
            DEFAULT: 'var(--pause)'
            soft: 'var(--pause-soft)'
            strong: 'var(--pause-strong)'
        stop:
            DEFAULT: 'var(--stop)'
            soft: 'var(--stop-soft)'
            strong: 'var(--stop-strong)'

        marquee:
            edge: 'var(--marquee-edge)'
            fill: 'var(--marquee-fill)'

    # ⚠ **`radius` is missing on purpose, and this is the one place the token model does not reach.**
    # `EditorTheme` has three radii — `--radius-panel`, `--radius-control`, `--radius-row` — and
    # `ThemeTokens.Radius` is a `Dictionary<string, float>`: it parses numbers, so `var(--radius-row)`
    # is rejected with a diagnostic rather than stored. Writing `row: 4` here instead would put the
    # number in two files and make "the editor's corners are softer now" a two-place edit, which is
    # the exact failure the token model exists to prevent. Until `ThemeTokens` can hold a string
    # radius, `rounded-[var(--radius-row)]` is the way to say it and it goes through the arbitrary
    # value path unchanged.

    # Shadows *are* strings, so the elevation token survives the round trip whole — which is also the
    # shape a shadow token should have: offset, blur and alpha are chosen together to read as one
    # height above the surface, and a scale that let them be picked apart would invite the
    # combinations that do not.
    shadow:
        elevation: 'var(--elevation)'

    # ⚠ `EditorTheme` declares no font-size tokens — it writes sizes inline, mostly as `em` against
    # the host's — so this is a new scale rather than a mirror of an existing one, and it is kept to
    # the four sizes the chrome actually uses. The pair is [size, line-height] in pixels.
    fontSize:
        xs: [10, 14]
        sm: [11, 16]
        base: [12, 18]
        lg: [14, 20]

    fontWeight:
        normal: 400
        medium: 500
        semibold: 600
        bold: 700

    # ⚠ No `screens`. A tool window is not a page: a panel is sized by the dock that holds it and not
    # by the display, so a `md:` variant would be asking the wrong question — the answer a panel wants
    # is its own width, which a media query cannot see. Breakpoint variants stay unavailable rather
    # than available and misleading.
