name: Nightly

# The gate on every build runs the fuzzer for eighteen seconds — 12.1 M cases over twenty targets,
# measured rather than estimated — which is a very effective regression test and is not a thorough
# fuzz. This is the thorough one: the same harness, the same seeds, the same deterministic generator,
# given between five minutes and two hours a target instead of the second or two the gate spends on it.
#
# ⚠ ONE JOB PER TARGET, NOT ONE JOB. The fuzz leg was a single job that ran all twenty in series under
# one derived cap, and that shape cost three things. Its timeout-minutes was target-count arithmetic
# done by hand and went stale twice (150 → 180 → 240 → 255). A target that ends its own process —
# raven did, on a binder overflow the CLR takes the process down for — cost the other nineteen their
# results and left no artifact saying why, which is why raven was skipped by name for two nightlies.
# And every target shared one wall clock, so the budget one of them needed was a budget all of them
# had to be given. A matrix retires all three: each job derives its own cap from its own budget, a
# job that dies takes only itself, and a target that wants two hours can have them while a saturated
# grammar takes five minutes. Actions is free on public repositories, so what is being spent here is
# wall clock rather than compute, and the wall clock is now the largest single budget rather than the
# sum of twenty.
#
# docs/plan/12 § Test infrastructure asks for fuzzers "run nightly with a persistent corpus". The
# persistent corpus is Core/Vixen.Fuzz.Tests/Corpus, committed and replayed before every run; what
# this leg adds is the time. See Core/Vixen.Fuzz/README.md for what is fuzzed and what is owed —
# in particular that this is a behaviour signature rather than instrumented coverage, and that
# SharpFuzz over libFuzzer belongs here when it exists.

on:
  schedule:
    # 03:00 UTC, which is nobody's working day in the timezones this is developed in. Cron on a
    # default branch only, which is what GitHub does with schedules regardless.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per fuzz target (blank: the per-target budgets in nightly-budgets.json)'
        required: false
        default: ''
      skip:
        description: 'VIXEN_FUZZ_SKIP — targets to leave out of this run, comma separated'
        required: false
        default: ''
      iterations:
        description: 'VIXEN_PROPERTY_ITER — multiplier for the property leg (blank: the per-suite defaults)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # ⚠ The target list is read out of the repository rather than written here. Twenty names in this
  # file would be a second source of truth for a list that is already one — FuzzTargets.Names — and
  # the way that fails is a twenty-first target that the gate fuzzes on every build and the nightly
  # has never once run. Core/Vixen.Fuzz/nightly-budgets.json is the list CI can see, and
  # FuzzGateTests.TheNightlyMatrixIsTheRegistry fails on every build when it stops being the registry
  # in the registry's order. Nothing here parses C#, and nothing in C# parses YAML.
  targets:
    name: targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      # Printed as well as emitted, because the matrix is otherwise only visible as twenty job names
      # with no budgets on them and no reasons behind the budgets.
      - name: Read the target list and its budgets
        id: read
        run: |
          set -euo pipefail
          budgets=Core/Vixen.Fuzz/nightly-budgets.json
          echo "matrix=$(jq -c '.targets' "$budgets")" >> "$GITHUB_OUTPUT"
          jq -r '.targets[] | "\(.name)\t\(.seconds)s\t\(.why)"' "$budgets"
        shell: bash

  fuzz:
    name: fuzz (${{ matrix.target.name }})
    needs: targets
    runs-on: ubuntu-latest

    strategy:
      # ⚠ Without this, one target finding something cancels the other nineteen — which is the exact
      # failure this leg was made a matrix to end, arriving as a default rather than as a crash.
      # A fuzz finding is a result, not a reason to stop looking.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}

    # This target's own budget plus the runner's overhead, so it cannot drift the way the single
    # job's did: that number was the target count times the per-target seconds, recomputed by hand,
    # and it was wrong twice — once by twenty minutes, which is a nightly guaranteed to end on the
    # clock having reported nothing. Thirty minutes is the runner's own overhead (checkout, restore,
    # a Release build of the engine and spirv-tools measured at about twelve) plus slack, because a
    # cap that fires on a healthy run stops meaning anything.
    #
    # ⚠ Stored in the JSON rather than computed here, because **Actions expressions have no
    # arithmetic** — only comparison and logic. `${{ matrix.target.seconds / 60 + 30 }}` is not a
    # slower way to write this; it is a workflow the API refuses outright, with
    # `Unexpected symbol: '/'`, before a single job runs. `minutes` and `seconds` are held in step
    # by FuzzGateTests.TheNightlyMatrixIsTheRegistry rather than by whoever edits the file next.
    #
    # It is not a budget. VIXEN_FUZZ_SECONDS bounds the fuzzing and CaseGuard bounds a single case;
    # this is the third backstop, for the process that stops making progress in a way neither of
    # those can see. See Core/Vixen.Fuzz/README.md § The nightly's budgets.
    timeout-minutes: ${{ matrix.target.minutes }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # One key for twenty jobs, deliberately: they restore the same packages, and a key per target
      # would be twenty copies of one cache. They start together, so on a miss they all build it and
      # the first to finish writes it — the rest log a collision and carry on, which is noise rather
      # than a failure.
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-fuzz-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-fuzz-

      # spirv-tools carries spirv-val, which the `raven` target hands every module it generates. It
      # is the only oracle in this harness that is not Vixen checking its own work, and it is the
      # only one that can catch a backend emitting a module that is valid and *wrong*. Absent, that
      # target goes on generating and validates nothing — so TheSpirvValidatorIsInstalled fails
      # rather than skips, and this is the step that keeps it green. ci.yml installs it on both of
      # its legs for the same reason.
      - name: Install spirv-tools
        run: sudo apt-get update && sudo apt-get install -y spirv-tools
        shell: bash

      # VIXEN_FUZZ_ONLY is what makes this one target's job: the whole test class runs and the other
      # nineteen rows skip themselves with a reason, which is visible in the results where a
      # --filter'd row would simply be absent. A name that matches no target fails
      # TheSelectionNamesRealTargets rather than passing having fuzzed nothing.
      #
      # VIXEN_FUZZ_SKIP is empty and stays here as a hand override, for the night somebody needs a
      # target out of the way without editing this file. It is not how a broken target is handled any
      # more: it existed because raven ended the process on a binder overflow — no exception, no
      # finding, no artifact — and took the other nineteen targets' results with it. One job per
      # target is what actually fixes that, and the binder reports RVN2005 for a signature that
      # reaches its own type now besides (Corpus/raven/70ae34e20b4880ee.bin).
      #
      # The seconds are this target's own, measured; a workflow_dispatch value overrides every
      # target's, which is for a one-off deep run rather than for the schedule.
      - name: Fuzz
        run: |
          set -euo pipefail
          echo "$WHY"
          dotnet test Core/Vixen.Fuzz.Tests -c Release
        shell: bash
        env:
          VIXEN_FUZZ_ONLY: ${{ matrix.target.name }}
          VIXEN_FUZZ_SECONDS: ${{ github.event.inputs.seconds || matrix.target.seconds }}
          VIXEN_FUZZ_SKIP: ${{ github.event.inputs.skip }}
          # Through the environment rather than interpolated into the script, because this is prose
          # out of a JSON file and an apostrophe in it would otherwise be a shell syntax error.
          WHY: ${{ matrix.target.name }} gets ${{ matrix.target.seconds }}s — ${{ matrix.target.why }}

      # ⚠ THE TARGET HAS TO BE IN THE NAME. Twenty jobs uploading "fuzz-findings" is twenty
      # collisions, and upload-artifact v4 refuses a name that already exists — so nineteen of them
      # fail the upload and the findings they were carrying are gone with the runner. Losing those is
      # losing the one thing this leg exists to produce.
      #
      # The bytes, not just the message. A finding whose input only exists in an assertion string is
      # one somebody has to retype; the fix for each of these is to move the file into
      # Core/Vixen.Fuzz.Tests/Corpus and commit it, and it is a test from then on.
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings-${{ matrix.target.name }}
          path: artifacts/fuzz-findings/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results-${{ matrix.target.name }}
          path: Core/Vixen.Fuzz.Tests/TestResults/
          if-no-files-found: ignore

  # ── The properties nobody has time for on a push ─────────────────────────────────────────────────
  #
  # docs/plan/41's robustness criterion and docs/plan/42's exit criteria are statements about every
  # broken mesh and every set of islands, not about the corpora somebody assembled — so they are
  # written as CsCheck properties over generators. The gate runs each of those a hundred-odd times,
  # which is a regression test. This is the search.
  #
  # ⚠ THE MULTIPLIER IS NOT CsCheck_Iter, AND THE DIFFERENCE IS WHY THIS LEG NEEDED A HELPER. That
  # variable sets the *default* iteration count, and every property in these two suites passes iter:
  # explicitly — a number chosen so one slow property does not dominate a build. An explicit argument
  # wins, so CsCheck_Iter would be read here and silently do nothing, which is worse than not
  # offering it. PropertyBudget.Iterations multiplies what each property already asked for and keeps
  # their relative weights; VIXEN_PROPERTY_ITER is what this leg raises.
  #
  # ⚠ The seed is deliberately not pinned. CsCheck draws a fresh one per run, so this walks somewhere
  # new every night rather than further down one path — which is how a one-in-twenty flake in the
  # least-squares solver was found in the first place. The cost is that a failure here is not
  # reproducible from the workflow alone; the fix is the seed CsCheck prints on failure, which goes
  # into CsCheck_Seed and brings the case back exactly. That is the same bargain the fuzz leg makes
  # with its corpus.
  #
  # Two projects rather than one job over the solution: they fail independently, and a remesher that
  # takes its own process down should not cost the unwrapper its results — which is the lesson the
  # fuzz matrix above records at length.
  properties:
    name: properties (${{ matrix.suite.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: remeshing
            project: Core/Vixen.Geometry.Remeshing.Tests
            # Conditioning runs the whole seven-stage pipeline per case and the field solve is the
            # slow half, so this one buys fewer cases per minute than the unwrapper does.
            #
            # ⚠ RemeshPipelinePropertyTests calls Remesher.Remesh rather than one stage of it, and a
            # single case is a whole seven-stage remesh: 18 s for its 14 cases at the build's counts
            # and 57 s at fifteen times them. Its build counts are single digits for exactly that
            # reason, and the multiplier still fits — see the timeout note below.
            #
            # ⚠ This comment used to say the leg was EXPECTED TO FAIL on two defects that property
            # found, and it had gone stale in both halves — which is worth recording, because a
            # standing "expected to fail" is how a leg stops being read at all. The allocation
            # runaway through the mirror (602 faces to 3,999,656 quads, 8.7 GB) is CLOSED:
            # Remesher.RunawayMultiple is the brake and
            # RemeshPipelinePropertyTests.The_runaway_recipe_stays_within_a_bounded_multiple_of_its_budget
            # holds the line. The budget warning decided from the quantization's prediction rather
            # than from the mesh is still open and still deliberately unscoped — that file's remarks
            # have the reproducer and the mechanism — but it has not fired on a nightly in the six
            # runs to 2026-08-18.
            #
            # ⚠ What actually failed here on 2026-08-13, 08-16 and 08-18 was neither of those: a
            # nightly-only coverage assertion that at least one of the sampled meshes reached a
            # refusal. At the measured refusal rate that assertion lost a coin toss about half the
            # nights, which is a leg that cries wolf rather than a leg that found something. It is
            # now a pinned refusing input asserted deterministically, so a red here is the code.
            # See that property's remarks for the rate and the arithmetic.
            iterations: 15
          - name: uv
            project: Core/Vixen.Geometry.Uv.Tests
            iterations: 20

    # ⚠ These two numbers are measured rather than chosen. The uv suite's property tests take 1m42s
    # at the build's own counts and 6m57s at a multiplier of four — 4.1x, so the multiplier really
    # does multiply and the arithmetic is linear. Twenty is therefore about half an hour of
    # properties on this laptop, and a hosted runner is slower than a laptop, which is what the rest
    # of the ninety minutes is for. Raise them when a night finishes with hours to spare; do not
    # raise them to a number nobody has timed.
    #
    # ⚠ Both multipliers were re-measured when the two pipeline-level properties landed, and both
    # still fit with room to spare. The measurement is now taken over the property classes as a
    # whole, because that is what these multipliers scale:
    #
    #   remeshing  1m14s at the build's counts  ->  ~18 min at 15x
    #   uv           50s at the build's counts  ->  ~17 min at 20x
    #
    # Against ninety minutes, on a laptop; a hosted runner is slower, which is what the rest of the
    # budget is for. What the two new properties add is small — 18 s of the remeshing figure and 1 s
    # of the uv one, the latter because a 128-face primitive unwraps in milliseconds where a remesh
    # takes seconds. Checked directly rather than extrapolated: UvUnwrapPipelinePropertyTests is 15 s
    # at 20x and 1m51s at 150x, so the arithmetic really is linear.
    #
    # ⚠ The remeshing figure went up by more than the new class costs: its three RunawayGuard
    # classes share a non-parallel collection, so they no longer overlap. That was bought to stop a
    # descheduled case reading as a still-running one, and it did not work — measured on one machine
    # in one afternoon with the collection in force, the slowest single case read 12.7 s, 23.0 s,
    # 38.1 s and 54.4 s against a cap that was then sixty. Serialisation removes the interference
    # inside the assembly and nothing about the machine. The collection stays because the guard's
    # *allocation* ceiling is still process-wide and still the half that matters; see TimedCases.
    #
    # ⚠ THE NINETY BELOW IS WHAT RunawayGuard.Cap IS DERIVED FROM, WHICH MAKES THEM ONE DECISION.
    # The guard's job is to name a case that will never return before this timeout kills the runner
    # with nothing on the console, so its twenty minutes is sized to fit twice inside what is left of
    # ninety after the leg's own work — roughly 48 min, allowing a hosted runner twice the laptop
    # figures below and six minutes for checkout, restore and build. Cutting this number without
    # cutting that one leaves a guard that cannot report; raising the guard without raising this one
    # does the same. Neither is a wall-clock assertion about a case: see RunawayGuard.Cap's remarks
    # for why the clock cannot be one and what was measured and refuted before settling for a
    # backstop.
    #
    # ⚠ Not a budget — RunawayGuard bounds a single case on wall clock *and on allocation*, which is
    # the backstop that matters here. Two measured runaways in this code, and neither is a hang: a
    # pre-remesh handed a target edge length below the mesh's own mean quadruples its triangle count
    # every round and allocates 763 MB on the tenth, and a mirrored remesh asked for 96 quads turns
    # 602 faces into 3,999,656, allocating 8.7 GB in 42 s. Both return; no timeout catches either
    # before the runner dies. This is the third backstop, for the process that stops making progress
    # in a way neither of those can see.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-properties-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-properties-

      # Release, because these are numerical and the gate's own determinism tests run there — a
      # property that only holds under a debug build is not a property.
      - name: Run the properties
        run: |
          set -euo pipefail
          echo "${{ matrix.suite.name }}: every property at ${{ matrix.suite.iterations }}x its build count"
          dotnet test ${{ matrix.suite.project }} -c Release
        shell: bash
        env:
          VIXEN_PROPERTY_ITER: ${{ github.event.inputs.iterations || matrix.suite.iterations }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-results-${{ matrix.suite.name }}
          path: ${{ matrix.suite.project }}/TestResults/
          if-no-files-found: ignore

  # ── The SQL nobody has ever executed ────────────────────────────────────────────────────────────
  #
  # Every semantic in Vixen.Live.Persistence is asserted against MemoryPersistence, which is right:
  # idempotency, the fence and conservation are properties of the semantics, and asserting them
  # against a database would be a suite nobody runs on a push. What no in-memory store can answer is
  # whether the SQL in Schema.cs parses, whether `on conflict do nothing` means what the idempotency
  # claim assumes, whether the full outer join in ReconcileAsync is valid, and whether serializable
  # isolation actually refuses two concurrent spends of one balance. Those are properties of
  # PostgreSQL, and this is the only place they are checked.
  #
  # ⚠ The two implementations have diverged once already: an accepted append must raise the fence,
  # which was true in memory and silently false in SQL until somebody read one against the other.
  # Nothing but this job would catch the second one.
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: vixen
          POSTGRES_DB: vixen
        ports:
          - 5432:5432
        # Without the health check the first connection races the server's own start-up, which
        # presents as a flaky nightly rather than as a missing wait.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-postgres-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-postgres-

      # The tests skip when this is unset, which is what a laptop gets and what makes them harmless
      # on every other job. A skip is visible in the results, so this leg going quiet is something
      # somebody can see rather than something that silently stops running.
      - name: Persistence against PostgreSQL
        run: dotnet test Live/Vixen.Live.Persistence.Tests -c Release
        shell: bash
        env:
          VIXEN_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=vixen;Database=vixen

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-results
          path: Live/Vixen.Live.Persistence.Tests/TestResults/
          if-no-files-found: ignore

  # ── The two placement backends a push cannot exercise ───────────────────────────────────────────
  #
  # doc 27 § Testing: "Process in CI on every push. Docker and Kubernetes (kind) on the nightly leg —
  # the same shape as the platform matrix." Both projects are asserted against fakes, and both fakes
  # are the right call: the decisions ADR-019 argues about are properties of the OBJECT each backend
  # builds, and a fake makes those assertable in milliseconds. What a fake cannot answer is whether a
  # real daemon or a real API server accepts what was built.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-docker-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-docker-

      # ubuntu-latest ships a running daemon on /var/run/docker.sock, which is the socket
      # DockerEngine probes. Pulling the image up front keeps a slow registry out of the test's
      # timing, where it would read as the client being slow.
      - name: Pull the test image
        run: docker pull hello-world
        shell: bash

      - name: Placement against a real daemon
        run: dotnet test Live/Vixen.Live.Placement.Docker.Tests -c Release
        shell: bash
        env:
          VIXEN_DOCKER: '1'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-results
          path: Live/Vixen.Live.Placement.Docker.Tests/TestResults/
          if-no-files-found: ignore

  kubernetes:
    name: kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-kubernetes-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-kubernetes-

      - name: Start a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: vixen-nightly

      # ⚠ An explicit kubeconfig path rather than the ambient one. ClusterApi.Connect prefers
      # in-cluster credentials precisely so that a stray kubeconfig cannot decide where realms are
      # placed, and a test that read whatever was lying around would be the same accident wearing a
      # CI badge.
      - name: Write the kubeconfig and the namespace
        run: |
          kind get kubeconfig --name vixen-nightly > "$RUNNER_TEMP/kubeconfig"
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" create namespace vixen-nightly
        shell: bash

      - name: Placement against a real API server
        run: dotnet test Live/Vixen.Live.Placement.Kubernetes.Tests -c Release
        shell: bash
        env:
          VIXEN_KUBECONFIG: ${{ runner.temp }}/kubeconfig

      # What the cluster actually made of it, which is the half a passing assertion does not show —
      # a pod that was accepted and then never scheduled looks identical from the client side.
      - name: Describe whatever is left
        if: always()
        run: kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" -n vixen-nightly get pods -o wide || true
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-results
          path: Live/Vixen.Live.Placement.Kubernetes.Tests/TestResults/
          if-no-files-found: ignore

  # ── The gate that reports nothing when it does not run ──────────────────────────────────────────
  #
  # ⚠ A cancelled workflow run is neither red nor green. It raises no notification, it leaves no
  # failing check, and `gh run list` is the only place it is visible at all — so between 2026-09-01
  # and 2026-09-06 master accumulated twelve consecutive cancellations and read as fine the whole
  # time. ci.yml's concurrency policy is fixed (a push to master no longer cancels its predecessor,
  # and CiConcurrencyTests holds that), but the fix and the symptom are separate things: the reason
  # nobody noticed for five days is that nothing was watching, and a policy can be reverted.
  #
  # This is the watcher. It asks the one question the colour of any single run cannot answer — when
  # did CI last reach a verdict about master at all — and it is red when the answer is "not lately",
  # whatever that verdict was. ⚠ A *failure* is a completed run and satisfies this deliberately: red
  # master is a different problem with its own visible signal, and folding the two together gives one
  # alarm that cannot say which is wrong.
  #
  # The threshold is wall clock because staleness is wall clock; there is no work-shaped restatement
  # of "nothing has finished". Forty-eight hours is two nightlies, so one skipped scheduled run does
  # not cry wolf.
  ci-freshness:
    name: ci-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Read-only, and named rather than inherited: the default token's scope is a repository setting,
    # and a check that silently loses its API access would report nothing, which is the exact failure
    # it exists to catch.
    permissions:
      actions: read
      contents: read

    steps:
      - name: When did CI last reach a verdict about master
        run: |
          set -euo pipefail
          hours=48

          # `status=completed` includes `cancelled`, which is the value being detected — so the
          # conclusions are filtered here rather than by the query. `event=push` because a
          # workflow_dispatch run answers about whatever ref somebody typed.
          run=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0]')

          if [ -z "$run" ] || [ "$run" = "null" ]; then
            echo "::error::No push to master has ever produced a completed CI run in the last 100 attempts."
            exit 1
          fi

          finished=$(printf '%s' "$run" | jq -r '.updated_at')
          echo "Last completed master run: $(printf '%s' "$run" | jq -r '.id, .conclusion, .head_sha, .updated_at' | tr '\n' ' ')"

          age=$(( ( $(date -u +%s) - $(date -u -d "$finished" +%s) ) / 3600 ))
          echo "That is ${age}h ago; the threshold is ${hours}h."

          if [ "$age" -gt "$hours" ]; then
            echo "::error::CI has not reached a verdict about master for ${age}h. Runs are being cancelled or never start — check ci.yml's concurrency policy and the run queue."
            exit 1
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
