name: CI

# Every job here calls a Nuke target, and those are the same targets a developer runs locally.
# That is the whole point of having Nuke at all: "works on my machine" and "works in CI" cannot
# diverge if they are the same code path.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other two when one fails: a failure on exactly one OS is the most
      # informative result there is, and cancelling hides which ones were fine.
      fail-fast: false
      matrix:
        # These three legs are not only "does it build everywhere". They are the bit-exactness gate
        # docs/plan/16 § Testing asks for: Core/Vixen.Net.Tests/Wire asserts the wire format against
        # committed bytes, so running it on three operating systems and two architectures — macos-14
        # is arm64 — *is* the assertion that two peers encode a value identically. Dropping a leg
        # silently drops that, and the failure it would have caught is a desync rather than a build
        # error. Same argument for content determinism, which wants the same three.
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ matrix.os }}-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ matrix.os }}-

      # Silk.NET.SDL is bindings only — no native binary ships with the package — so the runner
      # needs libSDL2 or every Vixen.Platform.Desktop test skips itself and the leg goes green
      # having proved nothing. Windows runners have no package manager step here because the
      # Silk.NET loader finds SDL2.dll next to the test binary; that is owed to
      # Vixen.Platform.Native, and until it exists the Windows leg skips those tests.
      - name: Install SDL2 (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0

      # Assimp is the opposite case to SDL2 and needs the step anyway. Silk.NET.Assimp *does* bring
      # natives — Ultz.Native.Assimp is a dependency of the binding, and libassimp.so.5 lands in
      # runtimes/linux-x64/native like it should — but the Silk.NET loader does not look there on
      # Linux, and it does look in the equivalent place on macOS, which is why this leg is the only
      # one that ever failed. The symptom is not a skip: `Assimp.GetApi()` throws
      # FileNotFoundException on first use, so every test that reads a model fails at once — the
      # whole of ModelReader, ModelImporter, NavMeshImporter and ImportedGeometryLoads, around fifty
      # of them, all with the same stack.
      #
      # ⚠ The version has to be 5. Silk.NET.Assimp 2.23.0 binds Assimp 5's C ABI, Ubuntu's libassimp5
      # is 5.3, and a 6 here would load and then be wrong in ways a signature cannot catch.
      - name: Install Assimp (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libassimp5

      # lavapipe: Mesa's software Vulkan, a conformant driver with no GPU. docs/plan/10 calls Linux
      # CI's most valuable target for exactly this reason — it is what turns the Vulkan backend from
      # "tested on one laptop" into "tested on every push", and it is a *second* driver, which is
      # where a backend's real bugs live. The first run of this leg found one MoltenVK had accepted
      # in silence for weeks.
      - name: Install Vulkan and lavapipe (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # spirv-tools carries spirv-val, which Raven's golden SPIR-V tests require and which
          # they fail rather than skip without — the same guard as VIXEN_REQUIRE_VULKAN below.
          #
          # glslc is the differential oracle's other half (docs/plan/07 § C, docs/plan/12): it
          # compiles Raven's GLSL back to SPIR-V so the two emitters' interfaces can be diffed.
          # Ubuntu ships it in universe as `glslc`, out of the shaderc source package — the CLI
          # tool rather than `Silk.NET.Shaderc`, so shaderc's binaries never enter the restore
          # graph. Without it SpirvDifferentialTests has nothing to compare against, and doc 12
          # has required this install since it was written.
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools spirv-tools glslc
          vulkaninfo --summary | grep -E 'deviceName|apiVersion|driverName'
          glslc --version

      # spirv-tools for the same reason the Linux step above gives, and it belongs on both legs
      # rather than one: `SpirvBackendTests.The_validator_is_installed_so_these_tests_mean_something`
      # fails rather than skips when spirv-val is absent, deliberately, because a validator that is
      # quietly missing makes every other SPIR-V assertion in that file check the listing and not the
      # module. Installing it only on Linux meant the macOS leg failed that test on every run and the
      # rest of the file proved less than it looked like it did.
      #
      # shaderc for glslc, the differential oracle's other half — see the Linux step's note. This
      # leg had never installed it, so SpirvDifferentialTests reported thirteen silent passes here
      # on every run.
      - name: Install SDL2, spirv-tools and shaderc (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew install sdl2 spirv-tools shaderc
          glslc --version

      # The third leg, for the third time, and the argument does not change with the operating
      # system: three tests fail rather than skip when spirv-val is absent, and the Windows leg has
      # been failing all three on every run since they were written.
      #
      # ⚠ The Vulkan SDK rather than a spirv-tools package, because there is no such package here:
      # SPIRV-Tools publishes no release binaries, and LunarG's SDK is the one distribution that
      # carries spirv-val.exe with a version anybody can name. It brings the loader and the
      # validation layers with it; it does *not* bring a driver, so it does not change what
      # Vixen.Platform.Desktop.Tests can do — see DesktopPlatformTests, which skips when a window
      # cannot be made.
      #
      # The Bin directory goes on the path by hand. Chocolatey shims what a package installs into its
      # own directory, and this package installs into C:\VulkanSDK, so nothing is shimmed and PATH is
      # whatever the installer's own registry write left for the *next* process.
      #
      # ⚠ Retried, because the community feed answers 503 often enough to be a fact rather than an
      # accident — it took this leg down two minutes into a run that had nothing wrong with it. Three
      # attempts with a growing pause; a step that fetches from somebody else's server on every build
      # and gives up on the first refusal is a red build that says nothing about the change.
      - name: Install spirv-tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installed = $false

          foreach ($pause in 0, 20, 60) {
            if ($pause -gt 0) {
              Write-Host "The chocolatey feed refused; waiting $pause s and asking again."
              Start-Sleep -Seconds $pause
            }

            choco install vulkan-sdk --no-progress --yes

            if ($LASTEXITCODE -eq 0) {
              $installed = $true
              break
            }
          }

          if (-not $installed) { throw "The Vulkan SDK could not be installed after three attempts." }

          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "The Vulkan SDK installed nothing under C:\VulkanSDK." }
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$($sdk.FullName)\Bin\spirv-val.exe" --version

          # The SDK carries glslc.exe as well, which is why this leg is the only one where the
          # differential oracle has ever run — by accident rather than by decision. Asserted here so
          # that stays a fact rather than an assumption: the other two legs now install shaderc
          # deliberately, and a Windows SDK that stopped shipping glslc would otherwise take the
          # oracle back out on one leg in silence.
          & "$($sdk.FullName)\Bin\glslc.exe" --version

      # Keyed on the manifest, because that is the only thing that changes what would be downloaded.
      # A version bump is a new key and a fresh fetch; anything else is a hit.
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: artifacts/native/.cache
          key: native-${{ matrix.os }}-${{ hashFiles('build/native-dependencies.json') }}

      # Nothing ships a WebGPU implementation — no operating system has one and Silk.NET.WebGPU is
      # bindings only — so without this every Vixen.Graphics.WebGPU test that needs a device skips
      # itself and the backend's real half is never run. The pin is checksummed
      # (build/native-dependencies.json); see docs/plan/05 § Vixen.Graphics.WebGPU.
      - name: Restore native dependencies
        run: ./build.sh RestoreNativeDeps
        shell: bash

      - name: Test
        run: ./build.sh Test --configuration Release
        shell: bash
        env:
          # On the leg that installed a driver, a skipped Vulkan test is a failure. Without this a
          # runner that lost its ICD would report a green build having proved nothing at all, which
          # is the most expensive kind of green there is — and is precisely why the SDL install step
          # above exists too.
          VIXEN_REQUIRE_VULKAN: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

          # The same argument, on the leg where it has been observed to hold. macOS is where
          # wgpu-native was actually brought up against this backend — Metal, an Apple-silicon
          # adapter, the whole suite green including the offscreen draws — so a skip there is a
          # regression and is treated as one.
          #
          # OWED: the Linux leg. wgpu-native would run on the lavapipe this workflow already
          # installs, which would be a *second* implementation and therefore where the interesting
          # bugs are, exactly as it is for Vulkan. It is not gated here because nobody has watched it
          # come up on that runner yet, and turning on a gate for a claim nobody has checked is how a
          # leg starts failing for reasons unrelated to the change that tripped it. Watch one run,
          # then add ubuntu-latest to this condition.
          VIXEN_REQUIRE_WEBGPU: ${{ matrix.os == 'macos-14' && '1' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/
          if-no-files-found: ignore

      # The golden-image fixtures run under Test, so a wrong picture already fails the build. What
      # this adds is the ability to *see* it: a failure writes the rendering, the reference and a
      # diff, and without them the report says a number of pixels differed and nothing else.
      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff-${{ matrix.os }}
          path: |
            artifacts/golden-diff/
            **/bin/Release/net10.0/golden-diff/
          if-no-files-found: ignore

  checks:
    name: checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-checks-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-checks-

      # ⚠ Because CheckApi *builds*, and building a sample runs its content build, and a content
      # build imports models through Assimp. The test job installs this for the same reason its own
      # comment gives — the Silk.NET loader does not look in runtimes/linux-x64/native on Linux — and
      # this leg needs it the moment any sample ships a mesh. Without it every `.obj` under Samples/
      # fails to import, the content build exits 1, and the leg dies before a single gate runs, which
      # reads as "CheckArchitecture failed" and is nothing of the kind. Version 5 for the ABI reason
      # the test job records.
      - name: Install Assimp
        run: sudo apt-get update && sudo apt-get install -y libassimp5

      # CheckApi builds — it reads the assemblies rather than the source — which is why this leg
      # takes longer than the other two checks put together and why it is worth having: the diff it
      # fails on is the one nobody would have looked at otherwise.
      #
      # CheckDocs joins them for the same reason and reuses the same build: a public type with
      # neither a guide page nor a line in docs/DocsExempt.txt is a source change, and the job that
      # reads source changes is this one. Publishing the site is docs.yml's job, not a gate.
      - name: Architecture, API, format and docs
        run: ./build.sh CheckArchitecture CheckApi CheckFormat CheckDocs --configuration Release
        shell: bash

  # The three net10.0-browser projects, which until this job existed were built by nothing at all.
  #
  # They are outside Vixen.slnx — a net10.0-browser project cannot be *evaluated* without the
  # wasm-tools workload, so its presence there would break `dotnet build` for everyone who has not
  # installed it — which means `test`, `checks` and `pack` above have never seen a line of them.
  # `nuke CompileWeb` was the answer to that and it named one of the three, so two of them compiled
  # on nobody's machine but their author's. docs/plan/10 § Platform CI matrix has had a `web` row
  # since it was written.
  #
  # ⚠ This is a *separate* job rather than a step on `checks` because of the workload. Installing
  # wasm-tools brings the Emscripten SDK packs with it — this is the slow part, and it is a fixed
  # cost paid before anything of ours compiles — and a failure to fetch them would otherwise read as
  # "CheckArchitecture failed", which is the mistake the Assimp comments above record twice.
  web:
    name: web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-web-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-web-

      # Not cached. The workload installs into the SDK's own directory rather than into
      # NUGET_PACKAGES, so caching it means caching a dotnet root — which is coupled to the SDK
      # version setup-dotnet resolved, and is a stale-cache bug waiting for the next patch bump.
      # Measured against what it buys: this is minutes, and the run it protects is the one where
      # somebody's change to a browser binding does not compile.
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      # Two targets and two different claims.
      #
      # CompileWeb is "the three assemblies compile", which is the floor. PublishWeb is the one that
      # matters more: a *library* never evaluates build/Vixen.Platform.Web.props, so the emcc relink,
      # the WebGL2 minimum, the trimming profile and the static-web-asset layout apply only to a head
      # — and all three defects the web-head spike found live in exactly that gap. It publishes a
      # head and then asserts that the page it produced has an entry point and its bindings where
      # they are fetched from.
      - name: Compile and publish for the browser
        run: ./build.sh CompileWeb PublishWeb --configuration Release
        shell: bash

      # The published head, so a failure downstream of here can be loaded in a real browser by hand.
      # It is a probe and draws nothing; see docs/plan/spikes/web-head/RESULT.md.
      - name: Upload the published head
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-head
          path: artifacts/web/wwwroot/
          if-no-files-found: ignore

      # ⚠ OWED, and deliberately not bolted on here: the Playwright smoke test docs/plan/10 asks for.
      # It is the only thing that can cover the interop — every [JSImport] in these three projects is
      # untested by everything above, and BrowserModuleUrlTests covers the constants and not the
      # calls.
      #
      # It is owed rather than absent-by-oversight because there is a specific way to get it wrong
      # that the spike measured. `chrome-headless-shell --dump-dom` NEVER FIRES
      # requestAnimationFrame — a pure-JS control page counted zero callbacks in three seconds, with
      # or without --virtual-time-budget, --screenshot or SwiftShader, while the same page over CDP
      # counted 120/s. A leg built on --dump-dom would report a live frame loop as dead, which is the
      # most expensive shape a red build can have. It has to drive a real browser over CDP, as
      # docs/plan/spikes/web-head/drive.mjs does.
      #
      # And it needs a WebGPU adapter to be worth more than a load test, which no headless Chromium
      # on macOS would give the spike at any flag combination. That is a Linux job with
      # --enable-features=Vulkan over lavapipe — which this workflow already installs on the test
      # leg — and nobody has watched it come up.

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: [test, checks]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # ⚠ The same install the test and checks legs carry, and for the third time the same reason:
      # Pack builds, building a sample runs its content build, and a content build imports models
      # through Assimp — which the Silk.NET loader will not find in runtimes/linux-x64/native on
      # Linux. Without it every `.obj` under Samples/ fails to import with VX1001 and the job dies.
      #
      # It was missing because this job had never run. `pack` needs `test` and `checks`, both of
      # which have been failing for months, so it was skipped on every push — and a job that is
      # always skipped is a job whose steps nobody has ever checked. It ran for the first time on the
      # run that made the other three green, and failed on its first sample.
      - name: Install Assimp
        run: sudo apt-get update && sudo apt-get install -y libassimp5

      # ⚠ `--skip Test`, because this job's `needs:` already *is* the test run. Pack depends on Test in
      # the target graph — which is right for a developer typing `nuke Pack` — and in this workflow it
      # means the whole suite runs a fourth time, on a leg that has none of the native dependencies
      # the three test legs install for it. That is how this job spent twenty-five minutes in order to
      # fail on `TheSpirvValidatorIsInstalled`, a test that had passed on all three legs half an hour
      # earlier.
      #
      # ⚠ And Restore and Compile are named rather than left to be dependencies, because Nuke's
      # `--skip` takes the chain with it: skipping Test alone skipped Compile "because of Test" and
      # Restore "because of Compile", and Pack then ran with nothing built. Naming them puts them back
      # in as invoked targets. Compile is what DotNetPack's --no-build needs, and Restore is what
      # Compile's --no-restore needs.
      - name: Pack
        run: ./build.sh Restore Compile Pack --configuration Release --skip Test
        shell: bash

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
