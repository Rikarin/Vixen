name: CI

# Every job here calls a Nuke target, and those are the same targets a developer runs locally.
# That is the whole point of having Nuke at all: "works on my machine" and "works in CI" cannot
# diverge if they are the same code path.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other two when one fails: a failure on exactly one OS is the most
      # informative result there is, and cancelling hides which ones were fine.
      fail-fast: false
      matrix:
        # These three legs are not only "does it build everywhere". They are the bit-exactness gate
        # docs/plan/16 § Testing asks for: Core/Vixen.Net.Tests/Wire asserts the wire format against
        # committed bytes, so running it on three operating systems and two architectures — macos-14
        # is arm64 — *is* the assertion that two peers encode a value identically. Dropping a leg
        # silently drops that, and the failure it would have caught is a desync rather than a build
        # error. Same argument for content determinism, which wants the same three.
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ matrix.os }}-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ matrix.os }}-

      # Silk.NET.SDL is bindings only — no native binary ships with the package — so the runner
      # needs libSDL2 or every Vixen.Platform.Desktop test skips itself and the leg goes green
      # having proved nothing. Windows runners have no package manager step here because the
      # Silk.NET loader finds SDL2.dll next to the test binary; that is owed to
      # Vixen.Platform.Native, and until it exists the Windows leg skips those tests.
      - name: Install SDL2 (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0

      # Assimp is the opposite case to SDL2 and needs the step anyway. Silk.NET.Assimp *does* bring
      # natives — Ultz.Native.Assimp is a dependency of the binding, and libassimp.so.5 lands in
      # runtimes/linux-x64/native like it should — but the Silk.NET loader does not look there on
      # Linux, and it does look in the equivalent place on macOS, which is why this leg is the only
      # one that ever failed. The symptom is not a skip: `Assimp.GetApi()` throws
      # FileNotFoundException on first use, so every test that reads a model fails at once — the
      # whole of ModelReader, ModelImporter, NavMeshImporter and ImportedGeometryLoads, around fifty
      # of them, all with the same stack.
      #
      # ⚠ The version has to be 5. Silk.NET.Assimp 2.23.0 binds Assimp 5's C ABI, Ubuntu's libassimp5
      # is 5.3, and a 6 here would load and then be wrong in ways a signature cannot catch.
      - name: Install Assimp (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libassimp5

      # lavapipe: Mesa's software Vulkan, a conformant driver with no GPU. docs/plan/10 calls Linux
      # CI's most valuable target for exactly this reason — it is what turns the Vulkan backend from
      # "tested on one laptop" into "tested on every push", and it is a *second* driver, which is
      # where a backend's real bugs live. The first run of this leg found one MoltenVK had accepted
      # in silence for weeks.
      - name: Install Vulkan and lavapipe (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # spirv-tools carries spirv-val, which Raven's golden SPIR-V tests require and which
          # they fail rather than skip without — the same guard as VIXEN_REQUIRE_VULKAN below.
          #
          # glslc is the differential oracle's other half (docs/plan/07 § C, docs/plan/12): it
          # compiles Raven's GLSL back to SPIR-V so the two emitters' interfaces can be diffed.
          # Ubuntu ships it in universe as `glslc`, out of the shaderc source package — the CLI
          # tool rather than `Silk.NET.Shaderc`, so shaderc's binaries never enter the restore
          # graph. Without it SpirvDifferentialTests has nothing to compare against, and doc 12
          # has required this install since it was written.
          #
          # glslang-tools carries glslangValidator, the GLSL half of Vixen.Vfx.Tests' reference
          # front end. No leg installed it, so that half was a visible skip everywhere and only the
          # SPIR-V half could be guarded; with this it earns the same hard guard spirv-val has.
          # noble ships it in universe, and it is the package that owns /usr/bin/glslangValidator.
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools spirv-tools glslc glslang-tools
          vulkaninfo --summary | grep -E 'deviceName|apiVersion|driverName'
          glslc --version
          glslangValidator --version

      # spirv-tools for the same reason the Linux step above gives, and it belongs on both legs
      # rather than one: `SpirvBackendTests.The_validator_is_installed_so_these_tests_mean_something`
      # fails rather than skips when spirv-val is absent, deliberately, because a validator that is
      # quietly missing makes every other SPIR-V assertion in that file check the listing and not the
      # module. Installing it only on Linux meant the macOS leg failed that test on every run and the
      # rest of the file proved less than it looked like it did.
      #
      # shaderc for glslc, the differential oracle's other half — see the Linux step's note. This
      # leg had never installed it, so SpirvDifferentialTests reported thirteen silent passes here
      # on every run.
      #
      # glslang for glslangValidator — see the Linux step's note. ⚠ Homebrew's glslang installs
      # `glslangValidator` as a symlink to `glslang`; the alias is what upstream still ships and
      # what the tests look for, but the day it goes away this step is where it is noticed.
      - name: Install SDL2, spirv-tools, shaderc and glslang (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew install sdl2 spirv-tools shaderc glslang
          glslc --version
          glslangValidator --version

      # The third leg, for the third time, and the argument does not change with the operating
      # system: three tests fail rather than skip when spirv-val is absent, and the Windows leg has
      # been failing all three on every run since they were written.
      #
      # ⚠ The Vulkan SDK rather than a spirv-tools package, because there is no such package here:
      # SPIRV-Tools publishes no release binaries, and LunarG's SDK is the one distribution that
      # carries spirv-val.exe with a version anybody can name. It brings the loader and the
      # validation layers with it; it does *not* bring a driver, so it does not change what
      # Vixen.Platform.Desktop.Tests can do — see DesktopPlatformTests, which skips when a window
      # cannot be made.
      #
      # The Bin directory goes on the path by hand. Chocolatey shims what a package installs into its
      # own directory, and this package installs into C:\VulkanSDK, so nothing is shimmed and PATH is
      # whatever the installer's own registry write left for the *next* process.
      #
      # ⚠ Retried, because the community feed answers 503 often enough to be a fact rather than an
      # accident — it took this leg down two minutes into a run that had nothing wrong with it. Three
      # attempts with a growing pause; a step that fetches from somebody else's server on every build
      # and gives up on the first refusal is a red build that says nothing about the change.
      - name: Install spirv-tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installed = $false

          foreach ($pause in 0, 20, 60) {
            if ($pause -gt 0) {
              Write-Host "The chocolatey feed refused; waiting $pause s and asking again."
              Start-Sleep -Seconds $pause
            }

            choco install vulkan-sdk --no-progress --yes

            if ($LASTEXITCODE -eq 0) {
              $installed = $true
              break
            }
          }

          if (-not $installed) { throw "The Vulkan SDK could not be installed after three attempts." }

          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "The Vulkan SDK installed nothing under C:\VulkanSDK." }
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$($sdk.FullName)\Bin\spirv-val.exe" --version

          # The SDK carries glslc.exe as well, which is why this leg is the only one where the
          # differential oracle has ever run — by accident rather than by decision. Reported here so
          # that stays a fact rather than an assumption; the other two legs now install shaderc
          # deliberately.
          #
          # Reported and not asserted: a missing glslc must not take the whole leg down before a
          # single test runs. SpirvDifferentialTests.The_oracle_is_installed_so_this_file_means_something
          # is the hard failure, and it says which tool and what to install.
          if (Test-Path "$($sdk.FullName)\Bin\glslc.exe") {
            & "$($sdk.FullName)\Bin\glslc.exe" --version
          } else {
            Write-Host "::warning::The Vulkan SDK did not ship glslc.exe; Raven's differential oracle will fail on this leg."
          }

          # And glslangValidator, on the same terms — this is the leg's only source of it, where the
          # other two now install glslang by package. The SDK ships it beside glslang.exe rather than
          # as an alias of it, so it is not at risk of a symlink step being dropped; reported and not
          # asserted all the same, because
          # VfxShaderEmitterTests.The_glsl_front_end_is_installed_so_these_tests_mean_something is the
          # hard failure and it names the tool.
          if (Test-Path "$($sdk.FullName)\Bin\glslangValidator.exe") {
            & "$($sdk.FullName)\Bin\glslangValidator.exe" --version
          } else {
            Write-Host "::warning::The Vulkan SDK did not ship glslangValidator.exe; the Vfx GLSL front-end guard will fail on this leg."
          }

      # Keyed on the manifest, because that is the only thing that changes what would be downloaded.
      # A version bump is a new key and a fresh fetch; anything else is a hit.
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: artifacts/native/.cache
          key: native-${{ matrix.os }}-${{ hashFiles('build/native-dependencies.json') }}

      # Nothing ships a WebGPU implementation — no operating system has one and Silk.NET.WebGPU is
      # bindings only — so without this every Vixen.Graphics.WebGPU test that needs a device skips
      # itself and the backend's real half is never run. The pin is checksummed
      # (build/native-dependencies.json); see docs/plan/05 § Vixen.Graphics.WebGPU.
      - name: Restore native dependencies
        run: ./build.sh RestoreNativeDeps
        shell: bash

      - name: Test
        run: ./build.sh Test --configuration Release
        shell: bash
        env:
          # On the leg that installed a driver, a skipped Vulkan test is a failure. Without this a
          # runner that lost its ICD would report a green build having proved nothing at all, which
          # is the most expensive kind of green there is — and is precisely why the SDL install step
          # above exists too.
          VIXEN_REQUIRE_VULKAN: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

          # The same argument, on the leg where it has been observed to hold. macOS is where
          # wgpu-native was actually brought up against this backend — Metal, an Apple-silicon
          # adapter, the whole suite green including the offscreen draws — so a skip there is a
          # regression and is treated as one.
          #
          # OWED: the Linux leg. wgpu-native would run on the lavapipe this workflow already
          # installs, which would be a *second* implementation and therefore where the interesting
          # bugs are, exactly as it is for Vulkan. It is not gated here because nobody has watched it
          # come up on that runner yet, and turning on a gate for a claim nobody has checked is how a
          # leg starts failing for reasons unrelated to the change that tripped it. Watch one run,
          # then add ubuntu-latest to this condition.
          VIXEN_REQUIRE_WEBGPU: ${{ matrix.os == 'macos-14' && '1' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/
          if-no-files-found: ignore

      # The golden-image fixtures run under Test, so a wrong picture already fails the build. What
      # this adds is the ability to *see* it: a failure writes the rendering, the reference and a
      # diff, and without them the report says a number of pixels differed and nothing else.
      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff-${{ matrix.os }}
          path: |
            artifacts/golden-diff/
            **/bin/Release/net10.0/golden-diff/
          if-no-files-found: ignore

      # The half of "content determinism across three runners" that has to happen ON the runner.
      # Everything the test suite asserts about determinism is self-relative — two builds here, two
      # projects here — so all three legs would pass while producing three different catalogs. This
      # builds one fixed fixture with the target pinned and writes down the bytes; the `content-bytes`
      # job at the bottom of this file is what compares them to each other.
      - name: Build the content-determinism fixture
        run: ./build.sh ContentBytes --configuration Release
        shell: bash

      # The build output as well as the manifest, and it is about a hundred bytes plus one small
      # bundle. A comparison that can only say "two hashes differ" sends whoever reads it back to CI
      # to get the files; shipping them costs nothing and is the difference between a report and a
      # lead.
      - name: Upload the content manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-bytes-${{ matrix.os }}
          path: |
            artifacts/content-bytes/manifest.txt
            artifacts/content-bytes/build/
          if-no-files-found: error

      # The half of docs/plan/41 § Exit 3 that has to happen ON the runner. That criterion is "ten
      # runs × {1, 4, 16} threads × three platforms, byte-identical output"; RemeshDeterminismTests
      # covers the first two axes and every assertion in it is self-relative, so all three legs pass
      # while producing three different meshes. This remeshes one pinned procedural fixture at each
      # of those worker counts and writes down the bytes; the `remesh-bytes` job at the bottom of
      # this file compares them to each other.
      #
      # ⚠ Seconds, not minutes, and it is here rather than in nightly.yml for that reason. The
      # fixture is a 400-quad sphere — the same one the determinism suite already remeshes thirty
      # times in this job — so the marginal cost is four more remeshes on a build that is already
      # done. nightly.yml's properties matrix is where the expensive remeshing lives and its
      # timeouts are measured rather than chosen; widening that matrix to three runners would have
      # tripled a leg budgeted at ~18 minutes to buy a comparison this buys for nothing.
      - name: Build the remesh-determinism manifest
        run: ./build.sh RemeshBytes --configuration Release
        shell: bash

      - name: Upload the remesh manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remesh-bytes-${{ matrix.os }}
          path: artifacts/remesh-bytes/manifest.txt
          if-no-files-found: error

  checks:
    name: checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-checks-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-checks-

      # ⚠ Because CheckApi *builds*, and building a sample runs its content build, and a content
      # build imports models through Assimp. The test job installs this for the same reason its own
      # comment gives — the Silk.NET loader does not look in runtimes/linux-x64/native on Linux — and
      # this leg needs it the moment any sample ships a mesh. Without it every `.obj` under Samples/
      # fails to import, the content build exits 1, and the leg dies before a single gate runs, which
      # reads as "CheckArchitecture failed" and is nothing of the kind. Version 5 for the ABI reason
      # the test job records.
      - name: Install Assimp
        run: sudo apt-get update && sudo apt-get install -y libassimp5

      # ⚠ The one thing on this leg that CI does not otherwise exercise at all. `build.sh` turns the
      # build lock off under CI — a runner owns its machine and has nothing to serialise — so
      # build/lock.py is the only file in the repository that every gate depends on and no gate
      # runs. It shipped holding a descriptor that MSBuild's node-reuse daemons inherited and kept
      # after the build exited, which queued the next developer's gate behind a run that had
      # finished; this is the twelve seconds that says so. It needs python3 and /bin/sh and nothing
      # else, and it never touches the machine's own lock file.
      - name: The build lock
        run: python3 build/lock_test.py
        shell: bash

      # CheckApi builds — it reads the assemblies rather than the source — which is why this leg
      # takes longer than the other two checks put together and why it is worth having: the diff it
      # fails on is the one nobody would have looked at otherwise.
      #
      # CheckDocs joins them for the same reason and reuses the same build: a public type with
      # neither a guide page nor a line in docs/DocsExempt.txt is a source change, and the job that
      # reads source changes is this one. Publishing the site is docs.yml's job, not a gate.
      #
      # CheckStrings joins them and costs four seconds: it reads every .cs and .vxml in the tree and
      # nothing else, because the half of the string-catalogue property it enforces — an id declared
      # and used nowhere — is the half no single compilation can see. The other half is
      # StringDeclarationAnalyzer, which runs inside the ordinary build and needs no leg of its own.
      # CheckDocsCoverage joins them and costs under a second, because it builds nothing at all: it
      # cross-checks the committed PublicAPI baselines against docs/DocsExempt.txt and the guide
      # pages' `api:` lists. It cannot replace CheckDocs — it sees only the projects that keep a
      # baseline — but it is the same question asked of text, so a developer can ask it before the
      # push instead of learning the answer from an eleven-minute sweep. That is the recurrence #480
      # records: four reds in one week, every one a subsystem landing with public types and no line.
      - name: Architecture, API, format, docs and strings
        run: ./build.sh CheckArchitecture CheckApi CheckFormat CheckDocsCoverage CheckDocs CheckStrings --configuration Release
        shell: bash

      # ⚠ A gate the whole repository was told to rely on and no job ran. CLAUDE.md tells every agent
      # to run CheckShaders after a codegen change, `UiShapeLayoutTests`, `ShaderReflectionTests` and
      # `Vixen.Ui.Desktop/README.md` all name it as the half that keeps a committed `.spv` in step
      # with the `.rvn` beside it — and until this step, "after a codegen change" meant "if somebody
      # remembered". A change to Raven's SPIR-V backend rewrites what every one of those modules
      # should contain, and nothing in CI opened them.
      #
      # A separate step rather than another name on the line above, because it shares nothing with
      # it: it builds Vixen.Raven.Cli and runs the compiler over shader sources, where those five
      # read the solution's assemblies and its text. A failure in either half then says which.
      #
      # ⚠ It needs no spirv-tools and no Vulkan, which is why it belongs on this leg rather than on
      # the three that install them. The target compares bytes with `File.ReadAllBytes`; `spirv-val`
      # appears in it only as a sentence printed after `--update-shaders` rewrites the modules.
      #
      # `--configuration Release` changes nothing here — the target hard-codes Release for the
      # compiler it builds and runs, as CLAUDE.md § Configuration records — and is passed so this
      # line does not read as the one job that opted out of it.
      - name: Shader modules against their sources
        run: ./build.sh CheckShaders --configuration Release
        shell: bash

  # The three net10.0-browser projects, which until this job existed were built by nothing at all.
  #
  # They are outside Vixen.slnx — a net10.0-browser project cannot be *evaluated* without the
  # wasm-tools workload, so its presence there would break `dotnet build` for everyone who has not
  # installed it — which means `test`, `checks` and `pack` above have never seen a line of them.
  # `nuke CompileWeb` was the answer to that and it named one of the three, so two of them compiled
  # on nobody's machine but their author's. docs/plan/10 § Platform CI matrix has had a `web` row
  # since it was written.
  #
  # ⚠ This is a *separate* job rather than a step on `checks` because of the workload. Installing
  # wasm-tools brings the Emscripten SDK packs with it — this is the slow part, and it is a fixed
  # cost paid before anything of ours compiles — and a failure to fetch them would otherwise read as
  # "CheckArchitecture failed", which is the mistake the Assimp comments above record twice.
  web:
    name: web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-web-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-web-

      # Not cached. The workload installs into the SDK's own directory rather than into
      # NUGET_PACKAGES, so caching it means caching a dotnet root — which is coupled to the SDK
      # version setup-dotnet resolved, and is a stale-cache bug waiting for the next patch bump.
      # Measured against what it buys: this is minutes, and the run it protects is the one where
      # somebody's change to a browser binding does not compile.
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      # Two targets and two different claims.
      #
      # CompileWeb is "the three assemblies compile", which is the floor. PublishWeb is the one that
      # matters more: a *library* never evaluates build/Vixen.Platform.Web.props, so the emcc relink,
      # the WebGL2 minimum, the trimming profile and the static-web-asset layout apply only to a head
      # — and all three defects the web-head spike found live in exactly that gap. It publishes a
      # head and then asserts that the page it produced has an entry point and its bindings where
      # they are fetched from.
      - name: Compile and publish for the browser
        run: ./build.sh CompileWeb PublishWeb --configuration Release
        shell: bash

      # The published head, so a failure downstream of here can be loaded in a real browser by hand.
      # It is Tools/Vixen.WebProbe, which draws nothing and says so; the findings it was promoted
      # out of are docs/plan/spikes/web-head/RESULT.md.
      - name: Upload the published head
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-head
          path: artifacts/web/wwwroot/
          if-no-files-found: ignore

      # ── The browser smoke leg ──────────────────────────────────────────────────────────────
      #
      # Node 22 or later, and pinned rather than taken from the image, for one reason: the driver
      # uses the GLOBAL WebSocket, which Node did not have until 22. Nothing else here needs a
      # particular Node, and there is no npm install — see below.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `nuke BrowserSmoke` publishes the head (via PublishWeb, which the step above has already
      # run and which is incremental), serves it over loopback with COOP/COEP, launches the Chrome
      # that ships on this runner image, drives it over CDP and asserts 35 things.
      #
      # ⚠ It is the only thing anywhere in this repository that CALLS a [JSImport]. Everything
      # above covers the boundary from one side — CompileWeb compiles the declarations,
      # BrowserModuleUrlTests knows the module-URL constants, PublishWeb knows where the files
      # landed, js/vixen-platform.test.mjs tests the JavaScript half against a DOM stub — and none
      # of them marshals a single call.
      #
      # ⚠ It drives a real browser over CDP and NOT `chrome-headless-shell --dump-dom`, which the
      # web-head spike measured never firing requestAnimationFrame: zero callbacks in three seconds
      # against 120/s over CDP, with or without --virtual-time-budget, --screenshot or SwiftShader.
      # A leg built on --dump-dom would report a live frame loop as dead. The driver counts rAF from
      # its own side before it believes anything the page says, and calls a zero there an INSTRUMENT
      # FAILURE rather than an engine defect.
      #
      # ⚠ No Playwright and no npm install. docs/plan/10 names Playwright and this does the same job
      # in ~200 lines of CDP over a WebSocket, because `nuke CheckAttribution` reads
      # Directory.Packages.props and native-dependencies.json and would not see an npm package at
      # all — so vendoring one would create an unattributed third-party dependency in the one place
      # the attribution gate cannot look. The browser is not vendored either: it is the Google
      # Chrome already on this runner image. If that image ever stops shipping one, this step FAILS
      # saying so; it does not skip. A browser gate that goes green having started no browser is the
      # failure mode this whole leg is written against.
      - name: Drive the published head in a real browser
        run: ./build.sh BrowserSmoke --configuration Release
        shell: bash

      - name: Upload the browser smoke transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: artifacts/browser-smoke/
          if-no-files-found: ignore

      # ⚠ STILL OWED, and narrower than it was: a WebGPU adapter. No headless Chromium on macOS
      # would give the spike one at any flag combination, so WebGpuDevice has still never been
      # constructed on the web and the probe reports that as an observation rather than a failing
      # check — making it a check would make the leg red everywhere and teach everyone to ignore it.
      # Closing it is a Linux job with --enable-features=Vulkan over the lavapipe this workflow
      # already installs on the test leg, and nobody has watched it come up.

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: [test, checks]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # ⚠ The same install the test and checks legs carry, and for the third time the same reason:
      # Pack builds, building a sample runs its content build, and a content build imports models
      # through Assimp — which the Silk.NET loader will not find in runtimes/linux-x64/native on
      # Linux. Without it every `.obj` under Samples/ fails to import with VX1001 and the job dies.
      #
      # It was missing because this job had never run. `pack` needs `test` and `checks`, both of
      # which have been failing for months, so it was skipped on every push — and a job that is
      # always skipped is a job whose steps nobody has ever checked. It ran for the first time on the
      # run that made the other three green, and failed on its first sample.
      - name: Install Assimp
        run: sudo apt-get update && sudo apt-get install -y libassimp5

      # ⚠ `--skip Test`, because this job's `needs:` already *is* the test run. Pack depends on Test in
      # the target graph — which is right for a developer typing `nuke Pack` — and in this workflow it
      # means the whole suite runs a fourth time, on a leg that has none of the native dependencies
      # the three test legs install for it. That is how this job spent twenty-five minutes in order to
      # fail on `TheSpirvValidatorIsInstalled`, a test that had passed on all three legs half an hour
      # earlier.
      #
      # ⚠ And Restore and Compile are named rather than left to be dependencies, because Nuke's
      # `--skip` takes the chain with it: skipping Test alone skipped Compile "because of Test" and
      # Restore "because of Compile", and Pack then ran with nothing built. Naming them puts them back
      # in as invoked targets. Compile is what DotNetPack's --no-build needs, and Restore is what
      # Compile's --no-restore needs.
      # ⚠ CheckTemplates is on this line rather than in a step of its own, and that is not tidiness:
      # Pack cleans artifacts/packages before it writes, so a second `./build.sh` invocation would
      # rebuild the feed CheckTemplates is supposed to consume. One invocation, one feed.
      #
      # This is the runner half of #114. The templates were verified through the real `dotnet new`
      # engine — packed, installed into a private hive, instantiated outside the repository — and
      # none of the six was ever restored or built, because a restore needs a feed and no feed
      # existed. artifacts/packages, one step earlier in this same run, is that feed.
      #
      # ⚠ And the assertion that makes it worth running is the negative control rather than the six
      # builds. A scaffolded project restores fine on a developer's machine from a directory outside
      # the repository — not because the repository is on disk, but because the global NuGet cache
      # holds ~57 Vixen.* packages at 0.1.0 from an earlier Pack — so "it restored" is green on any
      # machine that has ever packed, and says nothing. CheckTemplates therefore first requires a
      # restore to FAIL with the feed unwired, and stops if it does not.
      - name: Pack, and scaffold every template from what it packed
        run: ./build.sh Restore Compile Pack CheckTemplates --configuration Release --skip Test
        shell: bash

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg

  # ── The NativeAOT leg ───────────────────────────────────────────────────────────────────────────
  #
  # `nuke CheckAot` has existed since Phase 3 and no workflow named it. docs/overview.md § 1.1 has
  # carried the row — "Gate exists (`CheckAot`), leg does not — `ci.yml` names neither AOT target" —
  # and this is that row. The gate was not broken; it was simply never run except by hand, which for
  # a repository whose README calls NativeAOT a non-negotiable is the gap worth closing first.
  #
  # ⚠ THE MATRIX IS THE CHECK, NOT REDUNDANCY. `CheckAot` publishes for the HOST runtime identifier
  # and nothing else, deliberately — ILC cross-compiles poorly, so `--runtime linux-x64` from a Mac
  # is not the same question. One leg per operating system is therefore three different checks that
  # share a name, and dropping one drops a platform's AOT coverage outright rather than a third of
  # one run's. macos-14 is also the only arm64 leg, so it is the only place an ILC arm64 codegen
  # difference can show up at all.
  #
  # ⚠ AND A GREEN PUBLISH IS NOT THE ASSERTION — build/Build.cs's AssertAotOutput is. Measured on
  # 2026-09-03 on arm64 macOS: a real run writes a 19.9 MB Mach-O and ZERO managed assemblies. A
  # publish that quietly stopped being ahead-of-time still exits 0 and still writes an output
  # directory; what distinguishes it is `Vixen.*.dll` and a `.runtimeconfig.json` in there, which no
  # NativeAOT publish emits. The target names both, plus a 4 MB floor on the binary, because the
  # probe's README measured the rooted binary at ~8 MB against 1.3 MB for the same probe relying on
  # reachability from Main — so an emptied TrimmerRootAssembly list is a publish that still succeeds
  # and checks almost nothing. This leg would otherwise have been green forever, which is the same
  # thing the sample-frame leg's Null-device note says about counting on an exit code.
  #
  # ⚠ NO ASSIMP, NO NATIVE-DEPENDENCY RESTORE, NO SDL, unlike every other job in this file. CheckAot
  # depends on Restore and publishes one project graph; it runs no content build, boots no sample and
  # never executes the binary it produces, so none of the native libraries the other legs install for
  # their own reasons are reachable from here. Verified locally: a fresh worktree with no
  # `nuke RestoreNativeDeps` publishes and asserts clean in 2 m 35 s.
  #
  # ⚠ CheckAotIos IS DELIBERATELY NOT ON THIS JOB, AND THAT IS A GAP RATHER THAN A DECISION.
  # README.md § non-negotiables says "iOS is NativeAOT-only, and that is gated" — the target exists
  # (`nuke CheckAotIos`, .Requires macOS) and no workflow runs it either, so today that sentence is
  # true of a developer's Mac and of nothing else. It is not added here because it needs the `ios`
  # workload and Xcode on top of RestoreNativeDeps for MoltenVK, none of which could be tried from
  # the machine this leg was written on — no workload is installed there, so the step would have been
  # committed unverified. #327 carries it.
  #
  # ⚠ AND WIRING IT UP STILL DOES NOT BUY WHAT THIS JOB BUYS. CheckAotIos was a DotNetPublish and
  # nothing else, asserting only the exit code — exactly the state CheckAot was in before the
  # paragraph above, where a publish with PublishAot edited out succeeded in 17 seconds having
  # written 51 managed assemblies. It now runs the two checks that need no device first: the probe
  # roots every assembly it references, and PublishAot plus the three warning properties are still
  # in the csproj. AssertAotOutput itself is still called by the desktop target and by nothing else,
  # because reading a net10.0-ios publish's output needs somebody with the workload to look at its
  # layout before anything asserts over it. So the iOS leg still needs that assertion as much as it
  # needs the runner. #634.
  aot:
    name: aot-${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Same argument as the test matrix: a failure on exactly one operating system is the most
      # informative result there is, and cancelling the others hides which ones were fine.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    # Measured at 2 m 35 s for the publish on an M1 Max with a warm restore. ILC is single-threaded
    # over a 29-assembly rooted graph and a hosted runner is slower than that, so the cap is generous
    # on purpose and is a hang check rather than a budget.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-aot-${{ matrix.os }}-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-aot-${{ matrix.os }}-

      # ILC links a native object file and needs a C toolchain to do it. The hosted Windows and macOS
      # images carry one (MSVC, and the Xcode command-line tools); the Ubuntu image has clang but not
      # the zlib headers ILC links against, and the failure without them is a linker error at the very
      # end of a several-minute publish. Installed rather than hoped for.
      - name: Install the native toolchain (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish every runtime assembly ahead of time
        run: ./build.sh CheckAot --configuration Release
        shell: bash

  # ── The leg that actually runs a sample ─────────────────────────────────────────────────────────
  #
  # Everything above builds and tests assemblies. Nothing above boots an application, and until this
  # job existed nothing on any push did: the content build's output, the asset bundle, the compositor
  # document, the standard frame's expansion, the shader variants a run compiles on demand, terrain,
  # foliage and the host's own frame loop are all upstream of a sample's first pixel, and a sample
  # that stopped producing one would have been found by whoever next ran it by hand. docs/overview.md
  # § 1.1 has had a row for this since the recipe was verified.
  #
  # ⚠ THE THING TO KNOW ABOUT THIS LEG IS HOW EASILY IT COULD HAVE PROVED NOTHING.
  # `--vixen-headless` alone gives a window with no presentable surface, GraphicsHost makes Vulkan
  # decline it — on every platform, deliberately, so that a dedicated server cannot silently start
  # needing a driver — and the run lands on the Null device. Measured on 2026-08-25: the same sample,
  # the same binary, once on a real device and once on Null, EXITED 0 BOTH TIMES, took the same wall
  # clock, and printed character-for-character identical counters — 26 objects extracted, 39 shader
  # variants compiled, 1 terrain, 1 grass field, TAA active, 111 reprojection draws. `--vixen-capture`
  # is what buys a device that can draw, and build/Build.SampleFrame.cs is where the assertions that
  # tell the two apart live. A leg that ran a sample and checked its exit code would have been green
  # forever.
  #
  # ⚠ And on this runner the device IS a software one — lavapipe reports PhysicalDeviceType.Cpu,
  # which the engine maps to the same AdapterKind.Software the Null device reports. So "a real device
  # rather than a software one" is the wrong assertion here and would fail this leg on every run. The
  # target names the one adapter it refuses instead.
  #
  # ⚠ SAMPLES/15-AIVILLAGE WAS CONSIDERED FOR THIS LEG AND IS DELIBERATELY NOT ON IT, WHICH IS
  # WRITTEN DOWN SO THAT THE NEXT READER DOES NOT RE-DECIDE IT. It does take --vixen-frames N and
  # --vixen-capture <dir> like every other sample, so it would run. But this leg's whole assertion is
  # a PICTURE — more than a thousand distinct colours in the captured frame, sample 03 measuring
  # around 44 000 and a frame that lost its content measuring 1 — and 15's evidence is not a picture.
  # Everything it asserts happens in SystemPhase.Update, several phases before anything draws, so a
  # headless run with no capture path still prints every SampleLog.Decided line. Adding it here would
  # gate the half it does not care about and leave the half it exists for ungated, and its own README
  # says the written PNG HAS NEVER BEEN VERIFIED — the sample was developed where a window cannot be
  # opened — so it would be a first red on something nobody has looked at.
  #
  # What is worth gating about that sample is already gated better: AiVillage.Agent.Tests runs the
  # village on a real EngineLoop, it is in Vixen.slnx, and the `test` job runs it on all three
  # runners rather than this one on Linux alone. Revisit if a log-shaped assertion arrives — "N
  # changes of mind, the guard picked the chase up inside its sight radius" is a closed-form oracle
  # and a better sample gate than a colour count. ⚠ #218's "sample-running leg" is the standing gap
  # here — #405 cites #188 for it and #188 is "Owed 51: Raven — Vixen.Raven.Transpile".
  sample-frame:
    name: sample-frame
    runs-on: ubuntu-latest

    # ⚠ NOT MEASURED, AND SAID SO RATHER THAN IMPLIED. What has been measured is a real GPU: on an
    # M1 Max the run is under a minute, and the frame count is not what it costs — 16 frames took
    # 34 s and 64 took 23-28 s, because the sample compiles 39 shader variants on demand and that is
    # most of it. On lavapipe the rasterisation is software and the balance is the other way, and
    # nobody has watched this leg come up. So the cap is generous on purpose, and `--frame-count` is
    # a parameter: if the first run says 64 frames is ten minutes of llvmpipe, lower it here rather
    # than deleting the leg. Most of the budget is the Release build the target depends on, which the
    # nightly's own notes put at about twelve minutes on a hosted runner.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-sample-frame-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-sample-frame-

      # The fourth job to need this, for the reason the other three give: building a sample runs its
      # content build, and a content build imports models through Assimp, which the Silk.NET loader
      # will not find in runtimes/linux-x64/native on Linux. Version 5 for the ABI reason the test
      # job records. Without it the sample's .obj files fail to import and the job dies before
      # anything renders.
      - name: Install Assimp
        run: sudo apt-get update && sudo apt-get install -y libassimp5

      # lavapipe, which is the whole reason this runs on Linux: a conformant Vulkan driver on a
      # runner with no GPU. The validation layers are not optional here either, though ⚠ NOT for the
      # reason this comment used to give: an instance that cannot load the layer it asked for does
      # *not* fail to create. `VulkanInstance.TryCreate` retries without the layer and logs a warning
      # (VulkanLog 2001/2002), so a runner missing the package renders a perfectly good picture with
      # no validation at all behind it — the leg's validation assertion then fails on
      # `ValidationActive` rather than on a count that would have read zero either way. The DYLD
      # story on macOS is the same shape, which is why .runsettings and `LayerEnvironment` exist.
      # vulkan-tools is for the summary printed below and nothing else.
      #
      # ⚠ No SDL2, deliberately, unlike the test leg. `--vixen-headless` reaches PlatformHost.Create
      # before any window is made and returns HeadlessPlatform, so no SDL entry point is ever called;
      # installing it would only make a future reader think this leg depends on a display.
      - name: Install Vulkan and lavapipe
        run: |
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools
          vulkaninfo --summary | grep -E 'deviceName|driverName'

      # One target, and it is the same one a developer types. It builds the solution, runs
      # Samples/03-PbrShowcase with no display for 64 frames, captures the last one, and fails unless
      # the log names a device that is not the Null one, the run happened on the Headless platform,
      # nothing was logged at Error, the validation layers were loaded and reported no error, and the
      # picture that came back has more than a thousand distinct colours in it. Sample 03 measures
      # around 44 000; a frame that lost its content measures 1.
      - name: Run a sample with no display and check the frame it captured
        run: ./build.sh SampleFrame --configuration Release
        shell: bash

      # ⚠ Always, not on failure. A red leg needs the picture to diagnose it and a green one needs it
      # to be worth having — the whole argument for capturing a frame rather than reading counters is
      # that somebody can hold the result, and an artifact uploaded only on failure is one nobody
      # ever sees on the day the picture quietly got worse.
      - name: Upload the captured frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-frame
          path: artifacts/sample-frame/
          if-no-files-found: warn

  # ── Content determinism, between the legs rather than within them ─────────────────────────────
  #
  # The matrix comment at the top of this file says the three legs "are" the content-determinism
  # gate, for the same reason they are the wire-format gate. That was half true: the wire format has
  # an oracle — bytes committed in Core/Vixen.Net.Tests/Wire — and content has none, so each leg was
  # asserting determinism against itself and nothing compared one leg to another. Three runners
  # producing three different catalogs would have gone green.
  #
  # ⚠ THE TARGET IS PINNED, IN build/Build.ContentBytes.cs, AND WITHOUT THAT THIS JOB IS RED ON ITS
  # FIRST RUN FOR A REASON THAT IS NOT A DEFECT. A build is a function of its target, the target is
  # written into the catalog, and the target nobody names is the operating system doing the building.
  # Measured locally before this was written: the fixture built twice for `Windows`, from two
  # different directories, agrees on all four files; built for `Linux` it differs in catalog.bin and
  # catalog.bin.hash and in nothing else. VixenCommandTests.TheSameContentBuiltForTwoTargetsIsNotThe-
  # SameBytes keeps that from silently stopping being true.
  #
  # AND IT NOW FAILS RATHER THAN REPORTS. `continue-on-error` came off after two runs were read
  # line by line rather than by their colour — 33010525512 and 33013241274, both of which downloaded
  # three artifacts of 1 592 bytes each, diffed three 4-line manifests and printed "All 3 runners
  # built the fixture into identical bytes". The four build outputs travel with the manifests, so
  # the claim was checked independently of the manifests that make it: re-hashed off CI, ubuntu,
  # windows and macos-14 agree byte for byte on the 1 075-byte bundle, the 371-byte catalog, its
  # hash and scenes.bin, and a fourth machine — an M1 Max, outside CI — reproduces the same four
  # hashes. The bundle is 1 075 bytes because ~10 KB of fixture went through LZ4, so the encoder's
  # output is inside what agreed. Run 33039836864 is the one that watched the promoted step: three
  # artifacts, the shape check below, the success line, and success as the *step's* exit code.
  #
  # ⚠ THREE MANIFESTS OF NOTHING ALSO AGREE WITH EACH OTHER, and the comparison below said so:
  # dry-run against three empty files it printed the success line and exited 0. `nuke ContentBytes`
  # asserts the fixture built four files, so that case cannot arrive today — but that assertion is
  # in the other job, and a comparator that cannot tell "identical" from "nothing was compared" is
  # the failure this repository keeps having. The shape check below is this job's own.
  content-bytes:
    name: content-bytes
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Download every leg's content manifest
        uses: actions/download-artifact@v4
        with:
          pattern: content-bytes-*
          path: manifests

      - name: Compare what the three runners built
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob

          found=(manifests/content-bytes-*/manifest.txt)

          # ⚠ A comparison of nothing agrees with itself. Three legs upload, so a count that is not
          # three means a leg did not get here — or that somebody grew the matrix and left this
          # number behind — and either is a finding rather than a pass. Not `-lt 3`: a fourth leg
          # would let a missing third one through.
          if [ "${#found[@]}" -ne 3 ]; then
            echo "::error::expected three content manifests, one per test leg, and found ${#found[@]}."
            exit 1
          fi

          # ⚠ Read the total, not only the count that passed. Four lines and four *well-formed*
          # lines are two different claims, and a manifest that is empty or half-written satisfies
          # the second on its own — three of those would diff clean and this job would report
          # agreement on nothing.
          for manifest in "${found[@]}"; do
            leg="$(basename "$(dirname "$manifest")")"
            total="$(wc -l < "$manifest" | tr -d '[:space:]')"
            hashed="$(grep -cE '^[0-9a-f]{64}  [^ ]+$' "$manifest" || true)"

            if [ "$total" -ne 4 ] || [ "$hashed" -ne 4 ]; then
              echo "::error::$leg's manifest has $total lines of which $hashed name a hashed file, and the fixture has 4. Nothing was compared."
              cat "$manifest"
              exit 1
            fi
          done

          reference="${found[0]}"
          reference_leg="$(basename "$(dirname "$reference")")"
          status=0

          for manifest in "${found[@]}"; do
            leg="$(basename "$(dirname "$manifest")")"

            {
              echo "### $leg"
              echo '```'
              cat "$manifest"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            if diff -u "$reference" "$manifest"; then
              continue
            fi

            status=1
            echo "::error::$leg and $reference_leg built the same content into different bytes."

            # The build output travels with the manifest, so this job can say which byte moved and
            # not only which hash did. Four small files: whoever reads this next wants the offset,
            # and going back to CI for the artifacts to get it is the difference between a report
            # and a lead. The two sizes come first because the difference this fixture is most
            # likely to see is a string in the catalog's ordinal table changing length, which moves
            # every offset after it — a byte-by-byte listing of that is noise, and two lengths is
            # the whole story. `cmp -l` is a decimal offset then the two bytes, in octal.
            for name in $(awk '{ print $2 }' "$reference" "$manifest" | sort -u); do
              theirs="$(dirname "$reference")/build/$name"
              mine="$(dirname "$manifest")/build/$name"

              if [ ! -f "$theirs" ] || [ ! -f "$mine" ]; then
                echo "  $name was built by one of the two legs and not the other."
                continue
              fi

              if ! cmp -s "$theirs" "$mine"; then
                echo "  $name: $(wc -c < "$theirs" | tr -d '[:space:]') bytes on $reference_leg, $(wc -c < "$mine" | tr -d '[:space:]') on $leg."
                cmp "$theirs" "$mine" 2>&1 | sed 's/^/    /' || true
                cmp -l "$theirs" "$mine" 2>/dev/null | head -8 | sed 's/^/    /' || true
              fi
            done
          done

          if [ "$status" -eq 0 ]; then
            echo "All ${#found[@]} runners built the fixture into identical bytes."
          fi

          exit "$status"

  # ── Remesh determinism, between the runners rather than within each ───────────────────────────
  #
  # docs/plan/41 § Exit 3 asks for "ten runs × {1, 4, 16} threads × three platforms, byte-identical
  # output" and § D14 calls determinism "a gate, not an aspiration". Two of the three axes were
  # gated: RemeshDeterminismTests does the runs and the thread sweep, and is honest that "each
  # against the calling thread is a weaker claim than each against each". The third was not gated at
  # all, because every assertion it makes is self-relative — ten runs here agree with ten runs here.
  # Three runners producing three different meshes would have gone green on all three.
  #
  # ⚠ WHAT ONLY A COMPARISON CAN FIND IS THE POINT. Math.Fma contracting a multiply-add on one JIT
  # and not another, an x87 spill on x86, a different Vector<T> width on macos-14's arm64 — each of
  # those changes the hierarchical field solve and none of them is visible to a machine comparing
  # itself against itself. The gate as it stood proved reproducibility; this is the half that proves
  # portability.
  #
  # ⚠ THE FULL {1, 4, 16} × THREE GRID IS BOUGHT BY TWO HALVES AND NOT BY THIS JOB ALONE, and that
  # is worth writing down rather than leaving as arithmetic somebody has to redo. Each leg's manifest
  # carries a line per worker count, so this job's diff is already per-thread-count; and the `test`
  # job runs the whole suite on all three runners, so RemeshDeterminismTests' ten-runs sweep also
  # happens three times. A difference that only appears at sixteen workers on one runner therefore
  # has two ways to show up, and the diff below names which leg and which count.
  #
  # ⚠ THE FIXTURE IS PROCEDURAL AND NOTHING IS IMPORTED. `vixen remesh` would have been the closer
  # parallel to the content job above, and it reads its input through Assimp — of which these three
  # runners install three different builds. Mesh bytes differing between two versions of a native
  # library is a real thing to know and is not a determinism defect in Vixen; it would have made this
  # red on day one for the wrong reason. Build.ContentBytes refused a model in its own fixture for
  # exactly this, in its own words.
  #
  # ⚠ THE COMPARISON DOES NOT FAIL THE BUILD YET, AND THAT IS DELIBERATE RATHER THAN TIMID. The
  # content job above shipped the same way and says so: `continue-on-error` came off after two runs
  # were read line by line rather than by their colour. Nobody has ever measured a remesh produced
  # on Windows against one produced on macOS, so whether these three agree today is unknown — and a
  # gate that is red on its first run for a reason nobody has looked at is a gate people learn to
  # ignore. THE SHAPE CHECK BELOW IS NOT EXEMPT: a missing leg or a malformed manifest fails hard,
  # because that is the failure mode this repository actually keeps having, and three manifests of
  # nothing agree with each other. Take `continue-on-error` off the compare step once one green run
  # has been read line by line; if the first runs disagree, that disagreement is the finding this
  # job was written to produce and it belongs in an issue rather than in a relaxed threshold.
  remesh-bytes:
    name: remesh-bytes
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Download every leg's remesh manifest
        uses: actions/download-artifact@v4
        with:
          pattern: remesh-bytes-*
          path: manifests

      # ⚠ A comparison of nothing agrees with itself, so the shape is checked before the contents
      # and this step is the one that fails hard. Three legs upload; a count that is not three means
      # a leg did not get here, or somebody grew the matrix and left this number behind. Not `-lt 3`:
      # a fourth leg would let a missing third one through.
      - name: Check that three well-formed manifests arrived
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob

          found=(manifests/remesh-bytes-*/manifest.txt)

          if [ "${#found[@]}" -ne 3 ]; then
            echo "::error::expected three remesh manifests, one per test leg, and found ${#found[@]}."
            exit 1
          fi

          # Read the total, not only the count that is well formed. Four lines and four *hashed*
          # lines are two different claims, and a truncated manifest satisfies the second alone.
          for manifest in "${found[@]}"; do
            leg="$(basename "$(dirname "$manifest")")"
            total="$(wc -l < "$manifest" | tr -d '[:space:]')"
            hashed="$(grep -cE '^[0-9a-f]{64}  [^ ]+$' "$manifest" || true)"

            if [ "$total" -ne 4 ] || [ "$hashed" -ne 4 ]; then
              echo "::error::$leg's manifest has $total lines of which $hashed name a hashed leg, and the fixture has 4. Nothing was compared."
              cat "$manifest"
              exit 1
            fi
          done

      # ⚠ Reported rather than enforced, for now, and the block above this job says for how long.
      - name: Compare what the three runners remeshed
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob

          found=(manifests/remesh-bytes-*/manifest.txt)
          reference="${found[0]}"
          reference_leg="$(basename "$(dirname "$reference")")"
          status=0

          for manifest in "${found[@]}"; do
            leg="$(basename "$(dirname "$manifest")")"

            {
              echo "### $leg"
              echo '```'
              cat "$manifest"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            if diff -u "$reference" "$manifest"; then
              continue
            fi

            status=1

            # Which worker counts moved, not only that the files differ. Every leg on one runner
            # differing is a portable arithmetic difference in the pipeline; one leg differing is a
            # threading difference that the other runner's thread sweep did not reach.
            differing="$(diff --unchanged-group-format='' --old-group-format='%<' --new-group-format='' --changed-group-format='%<' "$reference" "$manifest" | awk '{ print $2 }' | tr '\n' ' ')"

            echo "::error::$leg and $reference_leg remeshed the same fixture into different bytes at: ${differing:-every leg}."
          done

          if [ "$status" -eq 0 ]; then
            echo "All ${#found[@]} runners remeshed the fixture into identical bytes at every worker count."
          fi

          exit "$status"
