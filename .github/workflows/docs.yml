name: Docs

# vixenengine.org — docs/plan/25 § P5.
#
# This workflow publishes; it does not gate. The gate is `CheckDocs`, which runs in ci.yml beside
# CheckApi and CheckFormat on every pull request, because a public type with no page is a source
# change and belongs in the job that reads source changes. Splitting it that way keeps the fifteen
# minutes of prerendering off the pull requests that have nothing to do with the site.
#
# The site is static assets and nothing else — no server-side runtime (ADR-017) — so what this
# workflow publishes is a container image holding nginx and that directory (www/Dockerfile), and
# the image is the whole release. It goes to ghcr.io/rikarin/vixen-docs; the cluster that serves
# vixenengine.org pulls the tag. Nothing here reaches into the cluster, which is deliberate: a
# workflow with credentials to a private VPS is a workflow whose secrets are worth stealing.

on:
  push:
    branches: [master]
    tags: ['v*']

  # Filtered, unlike the push: a pull request that changes engine source changes the API pages, and
  # the gate that cares about that is CheckDocs in ci.yml. What this leg is for is seeing the site
  # you changed, which is only worth a build when you changed the site.
  pull_request:
    paths:
      - 'docs/**'
      - 'www/**'
      - 'Tools/Vixen.DocGen/**'
      - 'build/Build.Docs.cs'
      - '.github/workflows/docs.yml'

  workflow_dispatch:

# One publish at a time per ref, and never cancel a production one halfway: a cancelled push is a
# tag whose contents nobody can name.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    # `packages` to push the image, `pull-requests` to leave the pull command on the pull request
    # that produced one. The registry needs no secret of its own: `GITHUB_TOKEN` authenticates to
    # GHCR, which is most of why the image lives there rather than somewhere with a password.
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-docs-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-docs-

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml

      # Building the solution builds the samples, and building a sample runs its content build — so
      # this leg imports models even though it never renders one. Silk.NET.Assimp ships the native
      # and the Silk.NET loader does not look where it ships it on Linux; ci.yml's `Install Assimp`
      # step carries the long version of why, including why it must be 5 and not 6.
      #
      # Without it the failure is not a skip. Every model in every sample fails its import with
      # `VX1001: ModelImporter threw: Could not load from any of the possible library names!`, and
      # the graph build dies on an asset rather than on anything to do with documentation.
      - name: Install Assimp
        run: sudo apt-get update && sudo apt-get install -y libassimp5

      # In Release, and that is not a detail: the engine resolves its generators through
      # ProjectReference, so a graph read in another configuration silently loses everything they
      # emit — 298 types and four whole kinds, measured (docs/plan/spikes/docs-graph § F1). The Nuke
      # target passes it to both the build and the workspace for exactly that reason.
      - name: Build the graph
        run: ./build.sh Docs --configuration Release
        shell: bash

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: www

      # `bundle` copies the prerendered 404 to the root of the output, which is where the image's
      # `error_page` looks for it (www/nginx.conf).
      - name: Build the site
        run: pnpm build && pnpm bundle
        working-directory: www

      # No budget step. The file count was a gate because the host of the day refused a deployment
      # over 20 000 files; an image has no such number, so what was left was a build that failed on
      # a threshold nobody was holding it to. `pnpm check` still measures — files, the largest file
      # and both search tiers — and is worth running when the sweep adds a few hundred pages.
      #
      # The initial JS budget is untouched: `angular.json` fails the build on it, which is where it
      # always was.

      # The third consumer of the same graph — docs/plan/25 § Part 10. A server that cannot read the
      # graph fails here rather than in somebody's editor.
      - name: Agent surface
        run: node server.mjs --self-test
        working-directory: www/mcp

      # Small (~2 MB) and the input to the release diff in P6, so it is worth keeping per run.
      - name: Upload the graph
        uses: actions/upload-artifact@v4
        with:
          name: docs-graph
          path: artifacts/docs/graph.json
          if-no-files-found: error

      # ── Publishing ──────────────────────────────────────────────────────────────────────────────
      #
      # A fork's pull request cannot write to this repository's packages, and the `fork` test below
      # is how that stays a skipped step rather than a red one. Nothing is lost by it: the image is
      # built either way, so what a fork's pull request is actually asking — does this still build —
      # is answered before the push it cannot do.
      #
      # ⚠ **The first push creates the package private, whatever the repository is**, and no workflow
      # setting changes that — it is one switch in the package's own settings, once. Until it is
      # flipped, pulling the image needs a token, including the cluster's image-pull secret.

      - name: Name the image
        id: image
        shell: bash
        run: |
          # A registry path is lowercase and an owner is not, so the expansion is not cosmetic.
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vixen-docs"

          case "$GITHUB_REF" in
            # The image, not the URL scheme. `/docs/<version>/` is still P6 (§ 6.3) and this leg does
            # not bring it forward; what the tag buys is an immutable name a cluster can pin to a
            # release instead of to whatever `master` last built. `latest` deliberately stays on
            # `master`, because that is what the site root serves until there is a release to own it.
            refs/tags/v*) tags="$repository:${GITHUB_REF_NAME#v}" ;;
            refs/heads/master) tags="$repository:latest,$repository:master-${GITHUB_SHA::7}" ;;
            *) tags="$repository:pr-${{ github.event.pull_request.number }}" ;;
          esac

          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "first=${tags%%,*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No secret to rotate and none to leak into a fork: the job's own token is what GHCR
          # accepts, which is `packages: write` above and nothing else.
          password: ${{ secrets.GITHUB_TOKEN }}

      # `context: www` is the directory the Dockerfile lives in, and `.dockerignore` there cuts the
      # upload down to the server configuration and `dist/vixen-docs/browser` — the site the steps
      # above just built and checked. Nothing is rebuilt here.
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: www
          push: ${{ github.event.pull_request.head.repo.fork != true }}
          tags: ${{ steps.image.outputs.tags }}

      # The pull request equivalent of the preview the hosted deployment used to leave: not a URL,
      # because there is no public place to serve it from any more, but the two lines that put the
      # built site in front of whoever is reviewing it.
      - name: Leave the pull command
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
        uses: actions/github-script@v7
        env:
          IMAGE: ${{ steps.image.outputs.first }}
        with:
          script: |
            const image = process.env.IMAGE;
            const marker = '<!-- docs-preview -->';
            const body = `${marker}\n📖 **Docs preview:** \`${image}\`\n\n` +
              '```sh\n' +
              `docker run --rm -p 8080:8080 ${image}\n` +
              '```\n\n' +
              'Prerendered from this branch, served on :8080. Not indexed, not the live site.';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(comment => comment.body?.startsWith(marker));

            // Edited rather than appended: a pull request with fourteen pushes should carry one
            // command against the current build, not fourteen nobody can tell apart. The tag is
            // stable per pull request for the same reason — it is overwritten, so what the command
            // pulls is always the last build of that branch.
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # A tag is a release, and a release is where the version store and the `/docs/<version>/`
      # prefix land — P6. The image above is named for the tag; the site inside it is still the one
      # `master` serves, and saying so is cheaper than discovering it from a URL that does not exist.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::notice::${GITHUB_REF_NAME} built and pushed as ${{ steps.image.outputs.first }}. The /docs/<version>/ prefix is P6 — docs/plan/25 § 6.3."
