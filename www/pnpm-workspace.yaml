# pnpm 11 keeps its settings here rather than in package.json.
#
# `mcp/` is a second package in this project rather than a folder of the site: it publishes as
# `vixen-mcp`, ships to a different registry consumer, and must not drag Angular in as a dependency.
packages:
  - mcp

#
# esbuild and workerd ship platform binaries their install scripts unpack; left unbuilt, every
# `pnpm exec` re-runs install, fails, and takes the build with it.
allowBuilds:
  esbuild: true
  workerd: true
  '@parcel/watcher': true
  lmdb: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - '@xui/breadcrumb@2.1.0'
  - '@xui/callout@2.1.0'
  - '@xui/code-block@2.1.0'
  - '@xui/core@2.1.0'
  - '@xui/divider@2.1.0'
  - '@xui/icon@2.1.0'
  - '@xui/kbd@2.1.0'
  - '@xui/link@2.1.0'
  - '@xui/menu@2.1.0'
  - '@xui/omnibar@2.1.0'
  - '@xui/overflow-list@2.1.0'
  - '@xui/popover@2.1.0'
  - '@xui/prose@2.1.0'
  - '@xui/scroll-area@2.1.0'
  - '@xui/select@2.1.0'
  - '@xui/spinner@2.1.0'
  - '@xui/table@2.1.0'
  - '@xui/tabs@2.1.0'
  - '@xui/tag@2.1.0'
  - '@xui/text@2.1.0'
  - '@xui/toc@2.1.0'
  - '@xui/tree@2.1.0'
