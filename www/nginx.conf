# The server half of the image — docs/plan/25 § 8.1.
#
# Included into `http` as a conf.d drop-in, which is why the `map` below is allowed to be here: it
# is outside the server block, in the only context nginx accepts one.

# Cache-Control in one place rather than an `add_header` per location. `add_header` does not merge —
# a location that sets one drops every header inherited from the server block — so headers declared
# per location is how a page ends up served without the two security headers below.
#
# Everything is revalidated except the files whose names change when their contents do. Angular
# hashes those (`outputHashing: "all"`), so `main-A1B2C3D4.js` is immutable by construction; the
# HTML, the search index and `sitemap.xml` keep their names across deploys and must not be.
map $uri $vixen_cache_control {
    default                                                  "public, max-age=0, must-revalidate";
    "~-[0-9A-Z]{8,}\.(?:js|css|woff2?|png|jpe?g|webp|avif)$"  "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `always`, so they are on the 404 as well — the response most likely to be rendered from
    # something a reader typed.
    add_header Cache-Control $vixen_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Liveness and readiness. Cheap enough to probe every few seconds, and it never touches the
    # disk — a probe that read a file would go red for the wrong reason.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Every route prerenders to `<route>/index.html`. Serving that directly rather than letting the
    # `index` directive find it keeps a URL without a trailing slash from becoming a 301 to one:
    # the canonical links, the sitemap and the router all write the slashless form, and a redirect
    # on every navigation is a redirect on ~4 250 pages.
    #
    # `=404` rather than a rewrite to the 404 page, because `error_page` below renders it with a
    # real 404 status. A soft 404 is a page a crawler indexes.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Prerendered like every other route, so it reads without JavaScript, and the router renders the
    # same component over it on boot — hydration finds the markup it would have built.
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
